name: Tripora CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (.NET 10 / ASP.NET Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore Backend/Tripora.slnx

      - name: Build Backend Solution
        run: dotnet build Backend/Tripora.slnx --configuration Release --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test Backend/Tripora.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

  frontend-ci:
    name: Frontend (React 19 / Vite / Oxlint)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Frontend/tripora-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/tripora-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Code Quality Checks (Oxlint)
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build
